<main class="grid min-h-[100dvh] place-items-center bg-slate-50 p-5 font-sans select-none">
  <form (ngSubmit)="submit()" class="w-full max-w-sm rounded-3xl border border-white/80 bg-white/95 p-8 shadow-2xl shadow-slate-900/10 backdrop-blur-xl">
    <div class="flex items-center gap-2">
      <span class="size-2 rounded-full bg-rose-500 ring-4 ring-rose-500/20"></span>
      <p class="text-xs font-bold uppercase tracking-widest text-rose-600">Anti-Gravity</p>
    </div>
    <h1 class="mt-2 text-3xl font-bold tracking-tight text-slate-900">Bienvenue</h1>
    <p class="mt-1 text-sm text-slate-500">Connectez-vous pour explorer la carte des souvenirs.</p>

    <label class="mt-6 block text-sm font-semibold text-slate-700">Adresse e-mail
      <input [(ngModel)]="email" name="email" required type="email" autocomplete="email" placeholder="nom@exemple.com" class="mt-1.5 w-full rounded-2xl border border-slate-200 bg-slate-50/50 px-4 py-3 text-slate-800 outline-none transition-all placeholder:text-slate-400 focus:border-rose-500 focus:bg-white focus:ring-4 focus:ring-rose-100" />
    </label>
    
    <label class="mt-4 block text-sm font-semibold text-slate-700">Mot de passe
      <input [(ngModel)]="password" name="password" required type="password" autocomplete="current-password" placeholder="••••••••" class="mt-1.5 w-full rounded-2xl border border-slate-200 bg-slate-50/50 px-4 py-3 text-slate-800 outline-none transition-all placeholder:text-slate-400 focus:border-rose-500 focus:bg-white focus:ring-4 focus:ring-rose-100" />
    </label>

    @if (error()) { 
      <div class="mt-4 flex items-center gap-2 rounded-2xl bg-rose-50 p-3.5 text-sm font-medium text-rose-700 border border-rose-200">
        <svg class="size-4 shrink-0 text-rose-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
        <span>{{ error() }}</span>
      </div> 
    }

    <button [disabled]="loading()" class="mt-6 w-full rounded-2xl bg-slate-900 px-5 py-3.5 font-bold text-white shadow-xl shadow-slate-900/15 transition-all hover:bg-slate-800 active:scale-95 disabled:cursor-wait disabled:opacity-60">
      {{ loading() ? 'Connexion en cours…' : 'Se connecter' }}
    </button>
    <p class="mt-5 text-center text-xs leading-relaxed text-slate-400">Application privée sécurisée par Supabase Auth.</p>
  </form>
</main>
